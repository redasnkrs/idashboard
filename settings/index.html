<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réglages du tableau de bord</title>
<style>
  :root {
    --bg: #101014;
    --panel: #17171d;
    --line: #2b2b36;
    --text: #e8e8ee;
    --muted: #9a9aab;
    --accent: #ff9a2e;
    --ok: #3ddc84;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  }
  aside {
    width: 430px; min-width: 430px; height: 100vh; overflow-y: auto;
    padding: 20px 22px 40px; background: var(--panel);
    border-right: 1px solid var(--line);
  }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 22px 0 10px; }
  label.field { display: block; margin-bottom: 12px; }
  label.field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text] {
    width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: #0d0d11; color: var(--text);
    font: inherit;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .color {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0; font-size: 12px; color: var(--muted);
  }
  .color input { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line);
                 border-radius: 4px; background: none; cursor: pointer; }
  .color span { flex: 1; color: var(--text); }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .checks label { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 8px 0; }
  #status { margin-top: 18px; font-size: 12px; color: var(--ok); min-height: 18px; }
  #status.err { color: #ff5a5a; }
  main {
    flex: 1; min-width: 0; height: 100vh; display: flex;
    align-items: center; justify-content: center; background: #000; overflow: hidden;
  }
  #stage { position: relative; overflow: hidden; }
  #preview { width: 1024px; height: 600px; border: 0; transform-origin: top left;
             display: block; background: #000; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<aside>
  <h1>Réglages du tableau de bord</h1>
  <div class="sub">Les changements sont enregistrés et appliqués en direct sur le 7".</div>

  <label class="field"><span>Thème</span><select id="preset"></select></label>
  <label class="field"><span>Portée</span>
    <select id="scope">
      <option value="global">Tous les jeux (global)</option>
      <option value="game">Jeu — Assetto Corsa Evo</option>
      <option value="car">Voiture</option>
    </select>
  </label>
  <label class="field" id="keyWrap" style="display:none"><span>Nom de la voiture</span>
    <input type="text" id="key" placeholder="FERRARI 296 GT3">
    <div class="hint">Tel qu'affiché par le jeu (majuscules).</div>
  </label>

  <h2>Couleurs</h2>
  <div class="grid" id="colors"></div>

  <details>
    <summary>Couleurs avancées (fond, cadran, aiguille…)</summary>
    <div class="grid" id="advanced"></div>
  </details>

  <h2>Unités</h2>
  <div class="grid">
    <label class="field"><span>Vitesse</span>
      <select id="unitSpeed"><option value="kmh">km/h</option><option value="mph">mph</option></select>
    </label>
    <label class="field"><span>Température</span>
      <select id="unitTemp"><option value="c">°C</option><option value="f">°F</option></select>
    </label>
  </div>

  <h2>Blocs affichés</h2>
  <div class="checks" id="blocks"></div>

  <div id="status"></div>
</aside>

<main id="main"><div id="stage"><iframe id="preview" title="Aperçu"></iframe></div></main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MAIN = $('main'), STAGE = $('stage'), PREVIEW = $('preview');
  const COLOR_LABELS = [
    ['ink', 'Fond'], ['ivory', 'Chiffres'], ['muted', 'Texte secondaire'],
    ['rule', 'Filets'], ['off', 'Jauges éteintes'], ['amber', 'Accent principal'],
    ['red', 'Rouge'], ['green', 'Vert'], ['blue', 'Bleu'],
    ['violet', 'Violet'], ['dim', 'Voyants éteints'],
  ];
  const ADVANCED_LABELS = [
    ['backIn', 'Fond intérieur'], ['backOut', 'Fond extérieur'],
    ['faceIn', 'Cadran centre'], ['faceMid', 'Cadran milieu'], ['faceOut', 'Cadran bord'],
    ['bezelLight', 'Lunette clair'], ['bezelMid', 'Lunette milieu'], ['bezelDark', 'Lunette foncé'],
    ['needleFrom', 'Aiguille départ'], ['needleTo', 'Aiguille bout'],
    ['tachMinor', 'Graduations fines'], ['redText', 'Chiffres zone rouge'],
    ['arrowOff', 'Clignotants éteints'], ['ledOff', 'LED éteintes'],
    ['chipBorder', 'Pastilles bord'], ['chipActiveBg', 'Pastilles actives'],
    ['waitOverlay', 'Écran d\'attente'],
  ];
  const BLOCK_LABELS = [
    ['car', 'Voiture'], ['fuel', 'Carburant'], ['water', 'Eau'], ['oil', 'Huile'],
    ['pressures', 'Pressions'], ['telltales', 'Voyants'], ['track', 'Circuit'],
    ['lap', 'Tour en cours'], ['best', 'Meilleur'], ['last', 'Dernier'],
    ['position', 'Position'], ['aids', 'Aides'], ['shiftlights', 'Shift lights'],
  ];

  let info = null;
  let current = null;

  function addColor(container, key, label) {
    const row = document.createElement('label');
    row.className = 'color';
    const span = document.createElement('span');
    span.textContent = label;
    const input = document.createElement('input');
    input.type = 'color';
    input.dataset.key = key;
    input.addEventListener('input', scheduleSave);
    row.append(span, input);
    container.append(row);
  }
  COLOR_LABELS.forEach(([k, l]) => addColor($('colors'), k, l));
  ADVANCED_LABELS.forEach(([k, l]) => addColor($('advanced'), k, l));

  const blockInputs = [];
  BLOCK_LABELS.forEach(([key, label]) => {
    const row = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.dataset.block = key;
    input.addEventListener('change', scheduleSave);
    const span = document.createElement('span');
    span.textContent = label;
    row.append(input, span);
    $('blocks').append(row);
    blockInputs.push(input);
  });

  function fillForm(theme) {
    current = theme;
    document.querySelectorAll('#colors input, #advanced input').forEach(input => {
      const value = theme.colors[input.dataset.key];
      if (value) input.value = value;
    });
    $('unitSpeed').value = theme.units.speed === 'mph' ? 'mph' : 'kmh';
    $('unitTemp').value = theme.units.temp === 'f' ? 'f' : 'c';
    blockInputs.forEach(input => {
      input.checked = theme.blocks[input.dataset.block] !== false;
    });
  }

  function collect() {
    const colors = {};
    document.querySelectorAll('#colors input, #advanced input').forEach(input => {
      colors[input.dataset.key] = input.value;
    });
    const blocks = {};
    blockInputs.forEach(input => { blocks[input.dataset.block] = input.checked; });
    return {
      scope: $('scope').value,
      key: $('scope').value === 'game' ? 'acevo' : $('key').value.trim(),
      active: $('preset').value,
      overrides: {
        colors,
        units: { speed: $('unitSpeed').value, temp: $('unitTemp').value },
        blocks,
      },
    };
  }

  function setStatus(text, error) {
    const el = $('status');
    el.textContent = text;
    el.className = error ? 'err' : '';
  }

  let timer = 0;
  function scheduleSave() {
    clearTimeout(timer);
    timer = setTimeout(save, 250);
  }

  async function save() {
    const body = collect();
    if (body.scope === 'car' && !body.key) {
      setStatus('Indique le nom de la voiture.', true);
      return;
    }
    try {
      const r = await fetch('/api/themes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const result = await r.json();
      if (!r.ok || !result.ok) throw new Error(result.error || 'erreur');
      setStatus('Enregistré et appliqué.');
    } catch (e) {
      setStatus('Échec : ' + e.message, true);
    }
  }

  function previewUrl() {
    const scope = $('scope').value;
    if (scope === 'global') return '/dashboard?demo&nogame=1';
    let url = '/dashboard?demo&game=acevo';
    const car = $('key').value.trim();
    if (scope === 'car' && car) url += '&car=' + encodeURIComponent(car);
    return url;
  }

  function reloadPreview() {
    PREVIEW.src = previewUrl();
  }

  async function loadEffective() {
    const scope = $('scope').value;
    const query = [];
    if (scope !== 'global') query.push('game=acevo');
    if (scope === 'car') {
      const car = $('key').value.trim();
      if (car) query.push('car=' + encodeURIComponent(car));
    }
    const url = '/api/themes/active' + (query.length ? '?' + query.join('&') : '');
    const theme = await fetch(url, { cache: 'no-store' }).then(r => r.json());
    fillForm(theme);
  }

  function updateScopeUi() {
    const scope = $('scope').value;
    $('keyWrap').style.display = scope === 'car' ? '' : 'none';
    reloadPreview();
    loadEffective();
  }

  function fitPreview() {
    const scale = Math.min((MAIN.clientWidth - 40) / 1024, (MAIN.clientHeight - 40) / 600);
    PREVIEW.style.transform = 'scale(' + scale + ')';
    STAGE.style.width = (1024 * scale) + 'px';
    STAGE.style.height = (600 * scale) + 'px';
  }

  async function init() {
    info = await fetch('/api/themes', { cache: 'no-store' }).then(r => r.json());
    const preset = $('preset');
    Object.values(info.themes).forEach(theme => {
      const option = document.createElement('option');
      option.value = theme.id;
      option.textContent = theme.name || theme.id;
      preset.append(option);
    });
    preset.value = info.state.active || info.active;

    try {
      const dash = await fetch('/api/dash', { cache: 'no-store' }).then(r => r.json());
      if (dash && dash.car) $('key').value = dash.car;
    } catch (_) {}

    preset.addEventListener('change', async () => {
      const theme = info.themes[preset.value];
      if (theme) fillForm(theme);
      await save();
    });
    $('scope').addEventListener('change', updateScopeUi);
    $('key').addEventListener('change', () => { reloadPreview(); loadEffective(); });
    $('unitSpeed').addEventListener('change', scheduleSave);
    $('unitTemp').addEventListener('change', scheduleSave);
    addEventListener('resize', fitPreview);

    await loadEffective();
    fitPreview();
    reloadPreview();
  }

  init();
})();
</script>
</body>
</html>
