name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib
          version = pathlib.Path("VERSION").read_text().strip()
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == "v" + version, (tag, version)
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt -r requirements-build.txt
      - name: Build source ZIP
        run: python tools/build_release.py
      - name: Build Windows app
        run: python tools/build_windows.py
      - name: Prepare release notes
        run: python tools/release_notes.py --output release-notes.md
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip               --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
