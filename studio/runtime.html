<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idash · custom</title>
<style>
  :root { --ink: #050505; --ivory: #ece6d6; --muted: #8a8272;
          --amber: #ff9a2e;
          --font: "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden;
               cursor: none; user-select: none; -webkit-user-select: none; }
  #d { display: block; width: 100vw; height: 100vh;
       transition: filter .55s ease, opacity .55s ease; }
  #d.sleep { filter: grayscale(1) brightness(.52) contrast(.9); opacity: .8; }
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 10px;
          background: #000; color: var(--ivory); font-family: var(--font);
          font-size: 22px; }
  #wait small { color: var(--muted); font-size: 14px; }
  #wait .dot { width: 8px; height: 8px; border-radius: 50%;
               background: var(--amber); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { #d { transition: none; }
    #wait .dot { animation: none; } }
</style>
</head>
<body>
<svg id="d" viewBox="0 0 1024 600" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg"></svg>
<div id="wait">
  <span class="dot"></span>
  <div>Waiting for Assetto Corsa Evo</div>
  <small>Start a driving session to display telemetry</small>
</div>
<script src="/studio/icons.js"></script>
<script src="/studio/runtime.js"></script>
<script>
(() => {
  const svg = document.getElementById('d');
  const wait = document.getElementById('wait');
  if (!window.IDashStudio) {
    wait.textContent = 'Studio runtime indisponible';
    return;
  }
  const meta = window.__IDASH__ || {};
  IDashStudio.start({ svg, wait, layoutId: meta.id || null });
})();
</script>
</body>
</html>
